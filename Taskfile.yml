# Task (https://taskfile.dev) is the build runner for this project, chosen over
# make because none of this is file-dependency work — it is a list of named
# commands, which is what Task is good at and what make only tolerates.
#
#   task            list the tasks
#   task check      everything CI runs
version: '3'

vars:
  BINARY: tome
  # Matching the Dockerfile is not cosmetic: without this the AVIF encoder links
  # the binary against libc, which the distroless-static runtime image cannot
  # exec. See the comment in the Dockerfile.
  TAGS: nodynamic
  PACKAGE: github.com/runlevel-six/tomekeeper
  IMAGE: '{{.IMAGE | default "tomekeeper"}}'
  # --match 'v[0-9]*' so only release tags are described. Without it any stray
  # tag in the repository becomes the version of every local build, which is
  # exactly what was happening: an unrelated tag was being stamped into binaries
  # as though it were a release.
  VERSION:
    sh: git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X {{.PACKAGE}}/internal/version.Version={{.VERSION}}
    -X {{.PACKAGE}}/internal/version.Commit={{.COMMIT}}
    -X {{.PACKAGE}}/internal/version.Date={{.DATE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the tome binary into bin/
    # CGO_ENABLED=0 and TAGS together are what make the binary static, and the
    # container image needs it static. They are separate causes: cgo pulls libc in
    # through net and os/user, and without the tag the AVIF encoder pulls it in
    # through purego. Setting both here means `task build` produces the same
    # artifact the image ships, rather than one that happens to work locally.
    #
    # Deliberately *not* applied to the test tasks: `go test -race` requires cgo.
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -tags '{{.TAGS}}' -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} ./cmd/{{.BINARY}}

  run:
    desc: Run the server locally (needs TOME_DATABASE_URL)
    deps: [build]
    cmds:
      - ./bin/{{.BINARY}} serve

  test:
    desc: Run tests with the race detector (integration tests skip without a database)
    cmds:
      - go test -race -cover -tags '{{.TAGS}}' ./...

  test:integration:
    desc: Run tests against a live PostgreSQL, failing if TOME_TEST_DATABASE_URL is unset
    cmds:
      - |
        if [ -z "${TOME_TEST_DATABASE_URL:-}" ]; then
          echo "TOME_TEST_DATABASE_URL is not set." >&2
          echo "Integration tests would skip silently, which is not a pass." >&2
          echo "" >&2
          echo "  docker run -d --name tome-test -e POSTGRES_USER=tome -e POSTGRES_PASSWORD=tome \\" >&2
          echo "    -e POSTGRES_DB=tome_test -p 5432:5432 postgres:16-alpine" >&2
          echo "  export TOME_TEST_DATABASE_URL='postgres://tome:tome@localhost:5432/tome_test?sslmode=disable'" >&2
          exit 1
        fi
        go test -race -cover -tags '{{.TAGS}}' ./...

  test:corpus:
    desc: Run the extraction corpus against real pages, failing if TOME_TEST_CORPUS_DIR is unset
    cmds:
      - |
        if [ -z "${TOME_TEST_CORPUS_DIR:-}" ]; then
          echo "TOME_TEST_CORPUS_DIR is not set." >&2
          echo "Only the synthetic fixtures would run, and those measure nothing" >&2
          echo "about extraction against sites as they are actually built." >&2
          echo "" >&2
          echo "  export TOME_TEST_CORPUS_DIR=/path/to/tomekeeper-corpus" >&2
          echo "" >&2
          echo "The pages are not in this repository: they are third-party content." >&2
          echo "See internal/extract/testdata/pages/README.md for the file format." >&2
          exit 1
        fi
        go test -v -run TestCorpus ./internal/extract/

  fuzz:
    desc: Fuzz URL canonicalization, the function deduplication depends on
    vars:
      FUZZTIME: '{{.FUZZTIME | default "60s"}}'
    cmds:
      - go test -fuzz FuzzCanonicalize -fuzztime {{.FUZZTIME}} ./internal/urlcanon/

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format all Go source
    cmds:
      - gofmt -w -s .

  fmt:check:
    desc: Fail if any Go source is unformatted
    cmds:
      - |
        unformatted=$(gofmt -l -s .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt'd:" >&2
          echo "$unformatted" >&2
          exit 1
        fi

  check:
    desc: Everything CI runs — format, vet, lint, release pins, sign-off, test, build
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: release:check
      - task: dco
      - task: test
      - task: build

  hooks:install:
    desc: Point git at .githooks, which adds the DCO sign-off trailer for you
    cmds:
      # core.hooksPath rather than copying into .git/hooks, so the hooks stay
      # under review like anything else and a change reaches everyone who ran
      # this once. It is opt-in on purpose: a clone should not execute code
      # because it was cloned.
      - git config core.hooksPath .githooks
      - chmod +x .githooks/*
      - echo "git will now run the hooks in .githooks/ — sign-off is automatic."

  dco:
    desc: Verify new commits carry a DCO sign-off (origin/master..HEAD by default)
    cmds:
      - ./scripts/check-dco.sh {{.CLI_ARGS}}

  release:check:
    desc: Verify the release pins, the changelog, and the patch-migration rule
    cmds:
      - ./scripts/check-release.sh

  version:
    desc: Print the version this checkout would stamp into a build
    cmds:
      - echo "{{.VERSION}} ({{.COMMIT}}) {{.DATE}}"
    silent: true

  docker:build:
    desc: Build the container image
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        --build-arg DATE={{.DATE}}
        -t {{.IMAGE}}:{{.VERSION}} .
    # One tag, and not `latest`. A local build is a development build even when it
    # is built from a release tag — `latest` in the registry means the newest
    # published release, and a local image answering to the same name is how the
    # wrong bytes get run.

  docker:smoke:
    desc: Verify the container image — probes, embedded web interface, nonroot, clean SIGTERM
    cmds:
      - ./scripts/smoke.sh {{.IMAGE}}:smoke

  clean:
    desc: Remove build output
    cmds:
      - rm -rf bin/
