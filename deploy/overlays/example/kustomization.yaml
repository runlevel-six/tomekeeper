apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A worked example. Copy it to deploy/overlays/local — which is gitignored,
# because a hostname and a storage class are facts about your network and this
# repository is public — then change the host and the storage class and delete
# whatever does not apply to your cluster.

resources:
  - ../../base

# Ceph RBD. The base leaves storageClassName unset so that a cluster with a
# default class works out of the box; naming it here means a change to the
# cluster default cannot silently move the archive onto different storage.
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |
      - op: add
        path: /spec/storageClassName
        value: ceph-block

  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: ceph-block

  - target:
      kind: Ingress
      name: tomekeeper
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: tomekeeper.example.com
      # No TLS block, because the controller this was written against terminates
      # TLS with a default certificate and listing a secretName would mean
      # maintaining a second certificate for no benefit. If yours has no
      # default, add:
      #
      #   - op: add
      #     path: /spec/tls
      #     value: [{hosts: [your.host], secretName: your-tls}]
      #
      # and make sure TOME_COOKIE_SECURE stays true either way.

# The base already pins a release, so this block exists only to hold a version back
# or move it forward independently of the checkout — deploying v0.1.1 from a tree
# that has moved on, say. Delete it and you follow the base.
#
# Never `latest` or `edge` here. A tag that moves under a running deployment means
# an apply changes no spec and so triggers no rollout, which turns a deploy into
# "apply, then restart by hand" — and a restart by hand can outrun the migration.
# That is how this archive went down once.
#
# For an exact-bytes guarantee, replace newTag with the digest the publish workflow
# prints:
#
#   digest: sha256:...
images:
  - name: ghcr.io/runlevel-six/tomekeeper
    newTag: v1.2.2

# Who to contact about this fetcher.
#
# Deliberately absent from the base: it is a fact about who is running this, not
# about the software, and a default here would put somebody else's contact
# address on your requests. It belongs in your overlay, which is why it is one of
# the things to fill in before deploying.
#
# It becomes the "+<url>" in `tomekeeper/<version> (+<url>)`, sent with every
# outbound request. Unset — which is what you get if you delete this block — the
# archive still identifies itself by name and version but offers no way to be
# reached, and "who is hammering my server" then has no answer but an IP address.
# Any real page of yours will do: a repository, an about page, a mailto.
#
# Merged rather than replaced, so the base keeps owning every other setting and a
# key added by a future release is not silently dropped here.
#
# Keep it the same as the contact URL in any per-domain `user_agent` override you
# write. One fetcher advertising two ways to be reached is worse than one.
configMapGenerator:
  - name: tomekeeper-config
    behavior: merge
    literals:
      - TOME_CONTACT_URL=https://example.com/about
