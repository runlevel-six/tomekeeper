# Nightly backup: both halves, in one file, verified.
#
# This used to dump the database only, with the blob tree left to "replicate it
# separately, with something built for it". That was the honest description of a
# gap: the tree is the part that cannot be rebuilt — a page fetched from a site
# that has since changed or gone is gone with it — and the recipe for copying it
# was a paragraph a person ran by hand, which had been run exactly once.
#
# `tome backup` writes both halves as one archive and records a hash for every
# file the database records one for, so `tome backup --verify` can prove it is
# whole. That matters because the failure this replaces was silent: a documented
# `kubectl run --rm -i` streaming a tar delivered 24% of the bytes and exited 0.
#
# It runs the application's own image, which is what makes the same command work
# here, under Compose, and on a laptop. The image is distroless — no shell — so
# the rotating filename comes from pointing --to at a directory rather than from
# expanding date(1) in a script.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tomekeeper-backups
  labels:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: backup
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Seven rotating archives, each holding the whole archive: the database
      # (compressed, tens of megabytes) plus every byte of the tree (hundreds).
      # Sized for an archive of a few thousand articles with room to grow — do
      # the arithmetic before assuming it is enough, because unlike the old
      # database-only dumps this scales with the images.
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tomekeeper-backup
  labels:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # A missed window should not trigger a catch-up run hours later against a
  # database that is already being used.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # The blob volume is ReadWriteOnce, so this has to land on the node
          # already mounting it. Expressed rather than left to luck: on a
          # single-node cluster it is free, and adding a second node without
          # this would break the backup and nothing else.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: tomekeeper
                      app.kubernetes.io/component: worker
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/runlevel-six/tomekeeper:v0.17.2
              args: ["backup", "--to", "/backups"]
              envFrom:
                - configMapRef:
                    name: tomekeeper-config
              env:
                # Composed the same way every other container here does it, so
                # there is one place the connection string's shape is decided.
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: tomekeeper, key: postgres-password }
                - name: TOME_DATABASE_URL
                  value: postgres://tome:$(POSTGRES_PASSWORD)@postgres:5432/tome?sslmode=disable
              volumeMounts:
                - name: backups
                  mountPath: /backups
                # Read-only: a backup reads the archive and must not be able to
                # write into the thing it is copying.
                - name: blobs
                  mountPath: /var/lib/tomekeeper
                  readOnly: true
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                # The database half is buffered a table at a time and the tree is
                # streamed, so this does not grow with the archive.
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: tomekeeper-backups
            - name: blobs
              persistentVolumeClaim:
                claimName: tomekeeper-blobs
