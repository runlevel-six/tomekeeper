# The headless browser, for the domains flagged as needing JavaScript.
#
# **Runs by default, even though most archives will never use it.** That is a deliberate
# reversal of the obvious choice, and the reasoning is about people rather than resources.
#
# Scaled to zero it costs nothing — but then ticking "this site needs JavaScript" in the
# interface does nothing observable, and the person who ticked it has no way to know why.
# Worse, the two halves are held by different people: a reader flags the domain, and only
# an administrator can scale a Deployment. Multi-user makes that gap wider, and it is not
# only readers who fall into it — an administrator inheriting a deployment finds a feature
# that works on one installation and not on theirs, with nothing in the interface to
# explain the difference.
#
# So the default is a browser that is present and idle. An administrator who would rather
# not spend the memory can scale it to zero knowing exactly what that costs, which is the
# right way round: an informed opt-out beats an uninformed non-feature.
#
#   kubectl -n tomekeeper scale deploy/tomekeeper-render --replicas=0   # if you want it off
#
# Nothing is rendered until a domain rule flags a host, so an idle browser changes no
# behavior on its own. And if it is scaled down, flagged articles *wait* rather than fail:
# they say "waiting for a headless browser" in the failed-fetch queue instead of
# disappearing into a pending state nobody can see. See
# docs/how-to/enable-headless-rendering.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomekeeper-render
  labels:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: render
spec:
  # One, not zero. See the comment above: the cost of an idle browser is ~256Mi, and the
  # cost of a missing one is somebody ticking a box and never finding out why nothing
  # happened.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tomekeeper
      app.kubernetes.io/component: render
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tomekeeper
        app.kubernetes.io/component: render
    spec:
      # A browser is the one thing here that renders other people's JavaScript, so it
      # gets the tightest context this image will tolerate. It cannot be
      # readOnlyRootFilesystem: Chrome writes its user data directory, and its own
      # sandbox is already disabled inside the container.
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headless
          # Pinned by digest-less tag deliberately: this is not our image and not our
          # release cycle, and a browser that is months stale is a browser that fails
          # on sites which have moved on. Upgrade it on its own schedule.
          image: chromedp/headless-shell:latest
          # No args. The image's entrypoint runs the browser on 127.0.0.1:9223 with a
          # socat exposing 9222, and anything passed here is *appended* to that command
          # line — so a second --remote-debugging-port makes the browser take socat's
          # port and nothing answers at all. Found the hard way.
          ports:
            - name: cdp
              containerPort: 9222
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # One page at a time is the worker's default (TOME_RENDER_CONCURRENCY), and
            # a document with its scripts fits inside this comfortably. Raising the
            # concurrency means raising this too — the same coupling image transcoding
            # has, and the same reason: the cost is per page, not per byte.
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # Liveness only. There is no readiness probe on purpose: nothing routes
          # traffic here through a Service the way an Ingress would, and the worker
          # already treats an unreachable browser as "not now" rather than as a
          # failure, so a pod that is up but not yet answering costs a retry.
          livenessProbe:
            tcpSocket:
              port: cdp
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tomekeeper-render
  labels:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: render
spec:
  # The name the worker is pointed at. A Service rather than a pod IP because the
  # browser is restarted on its own schedule, and because the websocket address the
  # browser advertises carries a GUID that changes every time it starts — the client
  # asks /json/version for the current one, so a stable host name is all this has to
  # provide.
  selector:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: render
  ports:
    - name: cdp
      port: 9222
      targetPort: cdp
