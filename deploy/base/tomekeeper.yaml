# The archive: a reader, a worker, and the volume they share.
#
# Two Deployments rather than one two-container pod, because the reader and the
# worker fail differently and should be restartable and observable on their own.
# The cost is that they have to be co-located — see the affinity rule below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tomekeeper-blobs
  labels:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Measured: 1,019 archived articles occupy 176MB, so roughly 173KB each,
      # of which images are about 62% and stored raw pages about 20%. 20Gi is on
      # the order of 100,000 articles. Grow it when it fills; do not guess high
      # now, because a Ceph RBD volume can be expanded in place and cannot be
      # shrunk.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomekeeper-server
  labels:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: the blob volume is ReadWriteOnce, so a surge
    # pod on another node would sit in Multi-Attach forever. A few seconds of
    # downtime during a deploy is the right trade for a single-reader archive.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tomekeeper
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tomekeeper
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for the schema this image needs, rather than starting against an
        # older one.
        #
        # `tome serve` refuses to serve a schema it predates — correctly — which
        # without this means a 503 readiness probe, an Ingress with no backend,
        # and a site that is down until somebody runs the migration. Kubernetes
        # cannot be told "apply the Job before these Deployments", because an
        # apply has no ordering, so the ordering lives here instead: the pod that
        # needs the schema is the thing that waits for it.
        #
        # What this buys is that a mis-ordered deploy becomes visible instead of
        # damaging. The pod sits in Init with the reason in its log, and under the
        # Recreate strategy the old pod is already gone — so this does not save
        # the downtime, it saves the crash loop and the guessing. It also waits
        # for Postgres itself, which is why there is no separate wait-for-postgres
        # container here.
        #
        # It migrates nothing. That stays a deliberate step: see migrate.yaml.
        - name: await-schema
          image: ghcr.io/runlevel-six/tomekeeper:v0.13.0
          args: ["await-schema"]
          envFrom:
            - configMapRef:
                name: tomekeeper-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: tomekeeper, key: postgres-password }
            - name: TOME_DATABASE_URL
              value: postgres://tome:$(POSTGRES_PASSWORD)@postgres:5432/tome?sslmode=disable
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: server
          image: ghcr.io/runlevel-six/tomekeeper:v0.13.0
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: tomekeeper-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: tomekeeper, key: postgres-password }
            # sslmode=disable because this never leaves the pod network. Turning
            # it on would mean issuing and rotating a certificate for a hop that
            # a cluster-network attacker already has better ways past.
            - name: TOME_DATABASE_URL
              value: postgres://tome:$(POSTGRES_PASSWORD)@postgres:5432/tome?sslmode=disable
            - name: TOME_SESSION_KEY
              valueFrom:
                secretKeyRef: { name: tomekeeper, key: session-key }
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: blobs
              mountPath: /var/lib/tomekeeper
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: tomekeeper-blobs
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomekeeper-worker
  labels:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tomekeeper
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tomekeeper
        app.kubernetes.io/component: worker
    spec:
      affinity:
        podAffinity:
          # The blob volume is ReadWriteOnce, so the worker that writes the
          # archive and the server that reads it have to be on the same node.
          # The server is the anchor because it is the thing that has to be up.
          #
          # The visible consequence: if the server is not running anywhere, this
          # pod sits Pending with "didn't match pod affinity rules" until it is.
          # That is the honest report of a real constraint, not a bug. On a
          # ReadWriteMany storage class, delete this whole block.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tomekeeper
                  app.kubernetes.io/component: server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The same wait as the server's, and it matters more here: `tome worker`
        # exits on an old schema rather than staying up unready, so without this
        # the worker enters CrashLoopBackOff — where the backoff stretches to five
        # minutes and keeps the queue stopped long after the migration lands. A
        # pod waiting in Init recovers the moment the schema arrives.
        - name: await-schema
          image: ghcr.io/runlevel-six/tomekeeper:v0.13.0
          args: ["await-schema"]
          envFrom:
            - configMapRef:
                name: tomekeeper-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: tomekeeper, key: postgres-password }
            - name: TOME_DATABASE_URL
              value: postgres://tome:$(POSTGRES_PASSWORD)@postgres:5432/tome?sslmode=disable
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: worker
          image: ghcr.io/runlevel-six/tomekeeper:v0.13.0
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: tomekeeper-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: tomekeeper, key: postgres-password }
            - name: TOME_DATABASE_URL
              value: postgres://tome:$(POSTGRES_PASSWORD)@postgres:5432/tome?sslmode=disable
            # The Go runtime cannot see the cgroup limit, so left alone it sizes
            # the heap from its own history and discovers the ceiling by being
            # killed at it. Set below the container limit, so the collector works
            # harder as it approaches rather than after.
            - name: GOMEMLIMIT
              value: "1750MiB"
            # Where the headless browser is, for the domains flagged as needing one.
            #
            # Set even though the render Deployment is scaled to zero: the worker
            # treats an unreachable browser as "not now" and leaves those articles
            # pending, so pointing at a Service that currently has no endpoints is
            # exactly the intended resting state. Scaling the Deployment up is then
            # the only action needed, with no worker restart and no config change.
            - name: TOME_RENDER_BROWSER_URL
              value: ws://tomekeeper-render:9222
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Raised from 1Gi after the first real archive OOM-killed the
              # worker during asset localization, and kept at 2Gi after
              # measuring why.
              #
              # One image transcode costs about 600MB and — the part that made
              # this hard to find — that figure barely changes with the size of
              # the image, because the AVIF encoder instantiates a WASM module
              # per call. Pixel limits therefore do nothing for it. The number
              # that matters is TOME_IMAGE_CONCURRENCY, which defaults to 2 and
              # puts the peak near 1.2GB.
              #
              # So: change TOME_IMAGE_CONCURRENCY and this together, not
              # TOME_WORKER_CONCURRENCY.
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: blobs
              mountPath: /var/lib/tomekeeper
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: tomekeeper-blobs
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tomekeeper
  labels:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: tomekeeper
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
  # Deliberately no metrics port on this Service. The Ingress routes to this
  # Service, and tome_outbound_responses_total names every host the archive
  # fetches from — a published list of what you read. Scrape the pod port
  # directly from inside the cluster instead. See docs/reference/metrics.md.
