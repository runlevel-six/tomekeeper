name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  image:
    name: Image and acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/smoke.sh builds the image itself and then asserts the M0
      # acceptance criteria against a running container. Keeping the assertions
      # in the script rather than in workflow steps means they can be run
      # locally, unchanged, when CI disagrees with a developer's machine.
      - name: Acceptance criteria
        run: ./scripts/smoke.sh tomekeeper:ci
