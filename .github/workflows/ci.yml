name: CI

on:
  push:
    # Both names, deliberately. This repository's default branch is master, and
    # listing only main meant every push since the first commit went to a branch
    # this workflow does not watch — so CI had never run at all, which is a
    # failure mode with no symptom. Naming both survives a rename in either
    # direction without silently switching CI off again.
    branches: [main, master]
    # Release tags, which is what the publish job's semver handling was written
    # for and never received: with only `branches` listed, a tag push does not
    # start this workflow at all, so `type=semver` and every `ref_type == 'tag'`
    # branch below was unreachable. Same shape of bug as the one that meant CI
    # had never run, and just as silent.
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    # Integration tests skip themselves when TOME_TEST_DATABASE_URL is unset,
    # so without this service they would quietly stop covering anything.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tome
          POSTGRES_PASSWORD: tome
          POSTGRES_DB: tome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TOME_TEST_DATABASE_URL: postgres://tome:tome@localhost:5432/tome_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd: $unformatted"
            exit 1
          fi

      # go.mod is maintained by hand when the module proxy is unreachable, so
      # CI is the thing that proves it matches what the code actually imports.
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy; run 'go mod tidy'"
            git diff go.mod go.sum
            exit 1
          fi

      # -tags nodynamic everywhere, matching the Dockerfile: without it the binary
      # links against libc and cannot run in the distroless-static image, and the
      # tests would be exercising a different build than the one that ships.
      - name: Vet
        run: go vet -tags nodynamic ./...

      - name: Build
        run: go build -tags nodynamic ./...

      - name: Test
        run: go test -race -cover -tags nodynamic ./...

      # A skipped integration test looks exactly like a passing one in the
      # summary. This fails the job if the database-backed tests did not
      # actually run.
      - name: Verify integration tests ran
        run: |
          output=$(go test -v -tags nodynamic -run 'Integration|Database|Deduplication|Scoping|Migrations|Import' ./internal/... 2>&1)
          if echo "$output" | grep -q "SKIP"; then
            echo "::error::Integration tests skipped despite TOME_TEST_DATABASE_URL being set"
            echo "$output" | grep "SKIP"
            exit 1
          fi

      # The real extraction corpus is third-party content and lives outside this
      # repository, so it is absent on contributor PRs and present only where
      # TOME_TEST_CORPUS_DIR is supplied. TestCorpus already fails when the
      # variable points somewhere unusable; what this catches is the variable
      # being set for the job but never reaching the test, which would look
      # exactly like a passing suite with the whole real corpus missing.
      - name: Verify the private corpus ran
        if: env.TOME_TEST_CORPUS_DIR != ''
        run: |
          output=$(go test -v -tags nodynamic -run TestCorpus ./internal/extract/ 2>&1)
          echo "$output" | grep 'corpus:' || true
          if echo "$output" | grep -qE 'corpus: [0-9]+ committed fixtures, 0 private pages'; then
            echo "::error::TOME_TEST_CORPUS_DIR is set for this job but no private pages loaded"
            exit 1
          fi

  fuzz:
    name: Fuzz URL canonicalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Deduplication is the property the whole archive rests on, and the
      # first minute of fuzzing found two real bugs. A short run on every
      # change is cheap insurance; the seed corpus keeps both regressions.
      - name: Fuzz
        run: go test -tags nodynamic -fuzz FuzzCanonicalize -fuzztime 60s ./internal/urlcanon/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The DCO check walks a range of commits, and the default shallow
          # checkout has no range to walk — it would report a pass over nothing.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      # Release pins: every manifest naming one version, that version being a
      # release rather than a moving tag, the changelog agreeing with it, and a
      # patch release adding no migration. Cheap, and it catches the half-finished
      # bump that puts the migration Job and the pods on different builds.
      - name: Check release pins
        run: ./scripts/check-release.sh

      # The DCO trailer CONTRIBUTING.md requires. .githooks/prepare-commit-msg
      # adds it, but a hook only helps whoever ran `task hooks:install`, so this
      # is the half that does not depend on a contributor's local setup.
      #
      # Scoped to what the event added, never to all history: commits from before
      # this check exist without a trailer, and a check that fails forever gets
      # switched off.
      - name: Check the DCO sign-off on new commits
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "a tag points at commits already checked when they landed on the branch"
            exit 0
          fi
          case "$BASE" in
            "" | 0000000000000000000000000000000000000000)
              # A branch's first push has no previous tip to compare against.
              range=$GITHUB_SHA ;;
            *)
              range=$BASE..$GITHUB_SHA ;;
          esac
          ./scripts/check-dco.sh "$range"

  image:
    name: Image and acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/smoke.sh builds the image itself and then asserts the
      # acceptance criteria against a running container. Keeping the assertions
      # in the script rather than in workflow steps means they can be run
      # locally, unchanged, when CI disagrees with a developer's machine.
      - name: Acceptance criteria
        run: ./scripts/smoke.sh tomekeeper:ci

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    # Only after everything that can say the build is broken has said otherwise.
    # An image that fails its own acceptance test is worse than no image: it looks
    # deployable.
    needs: [test, lint, fuzz, image]
    if: github.event_name == 'push'

    permissions:
      contents: write # to create the GitHub release for a tag
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history, because the version is `git describe` and a
          # shallow clone has neither. Without this an edge build reports a bare
          # commit and a release build cannot confirm it is on the tag it claims.
          fetch-depth: 0

      # One rule for both kinds of build, rather than a conditional: on a tag this
      # is exactly the tag (`v0.2.0`), and on the default branch it is the last
      # release plus how far past it we are (`v0.2.0-12-gfccf5ba`). The same
      # command the Taskfile uses locally, so a developer's binary and CI's agree
      # about what a version looks like.
      - name: Derive the version
        id: version
        run: |
          version=$(git describe --tags --match 'v[0-9]*' --always)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release is published once. Re-pushing a moved tag would replace the bytes
      # behind a version somebody has already deployed, which is the one thing that
      # makes a version number worthless — so it is refused here rather than
      # discovered later.
      #
      # After the login, deliberately: an unauthenticated `docker manifest inspect`
      # of a private package answers "unauthorized", which this would have read as
      # "not published yet" and waved through.
      - name: Refuse to republish an existing release
        if: github.ref_type == 'tag'
        run: |
          if docker manifest inspect "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::ghcr.io/${{ github.repository }}:${{ github.ref_name }} already exists." \
                 "Releases are never republished — cut ${{ github.ref_name }}+1 instead."
            exit 1
          fi
          echo "${{ github.ref_name }} has not been published before."

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is not managed by the action's own flavour, because its
          # "auto" meaning is one more thing to look up: it is spelled out below.
          flavor: latest=false
          # The tags, and what each one promises:
          #
          #   v0.2.0    the release. Identical to the git tag and to what
          #             `tome version` reports, so one string identifies a release
          #             in git, in the registry, in a Deployment, and in a log line.
          #   latest    the newest release, and only ever a release. It used to
          #             follow the default branch, which is how a restart could pull
          #             a build nobody had chosen — deployments pin a release now,
          #             and this is here for someone trying the tool out.
          #   edge      the tip of the default branch, named so that nobody
          #             mistakes it for a release.
          #   sha-...   every build, immutable, for bisecting.
          #
          # No moving `0.2` or `0` aliases. A tag that moves under a deployment is
          # exactly what this project has already been bitten by, and while the
          # major version is 0 a minor bump is allowed to break things — so `:0`
          # would be a promise this cannot keep.
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          # No attestation manifest. It makes the tag point at an index rather
          # than an image, and some older pull paths handle that badly for no
          # benefit here.
          provenance: false

      # The image has to agree with the tag it was published under. A mismatch
      # means the ldflags did not reach the binary — which is invisible until
      # somebody asks a running pod what it is and gets `dev`.
      - name: Verify the image reports its own version
        if: github.ref_type == 'tag'
        run: |
          image="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          reported=$(docker run --rm "$image" version)
          echo "$reported"
          case "$reported" in
            "tomekeeper ${{ github.ref_name }} "*) ;;
            *)
              echo "::error::$image reports '$reported', which does not start with the tag ${{ github.ref_name }}."
              exit 1
              ;;
          esac

      # The changelog section for this tag becomes the release notes, so the
      # release page and the file in the tree cannot drift. A tag with no section
      # is a release nobody wrote down, and that fails rather than publishing an
      # empty page.
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(mktemp)
          awk -v tag="${{ github.ref_name }}" '
            $0 ~ "^## \\[" tag "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"

          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no '## [${{ github.ref_name }}]' section."
            exit 1
          fi

          {
            echo
            echo '---'
            echo
            echo '### Image'
            echo
            echo '```'
            echo 'ghcr.io/${{ github.repository }}:${{ github.ref_name }}'
            echo 'ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$notes"

          prerelease=""
          case "${{ github.ref_name }}" in *-*) prerelease="--prerelease" ;; esac

          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "$notes" \
            $prerelease

      # Printed for both kinds of build: a running pod can be traced back to exact
      # bytes without going digging in the registry.
      - name: Report what was published
        run: |
          {
            echo "### Published \`${{ steps.version.outputs.version }}\`"
            echo
            echo 'Tags:'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo 'Digest — pin this for exact bytes:'
            echo '```'
            echo 'ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
