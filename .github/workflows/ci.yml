name: CI

on:
  push:
    # Both names, deliberately. This repository's default branch is master, and
    # listing only main meant every push since the first commit went to a branch
    # this workflow does not watch — so CI had never run at all, which is a
    # failure mode with no symptom. Naming both survives a rename in either
    # direction without silently switching CI off again.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    # Integration tests skip themselves when TOME_TEST_DATABASE_URL is unset,
    # so without this service they would quietly stop covering anything.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tome
          POSTGRES_PASSWORD: tome
          POSTGRES_DB: tome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TOME_TEST_DATABASE_URL: postgres://tome:tome@localhost:5432/tome_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd: $unformatted"
            exit 1
          fi

      # go.mod is maintained by hand when the module proxy is unreachable, so
      # CI is the thing that proves it matches what the code actually imports.
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy; run 'go mod tidy'"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

      # A skipped integration test looks exactly like a passing one in the
      # summary. This fails the job if the database-backed tests did not
      # actually run.
      - name: Verify integration tests ran
        run: |
          output=$(go test -v -run 'Integration|Database|Deduplication|Scoping|Migrations' ./internal/... 2>&1)
          if echo "$output" | grep -q "SKIP"; then
            echo "::error::Integration tests skipped despite TOME_TEST_DATABASE_URL being set"
            echo "$output" | grep "SKIP"
            exit 1
          fi

      # The real extraction corpus is third-party content and lives outside this
      # repository, so it is absent on contributor PRs and present only where
      # TOME_TEST_CORPUS_DIR is supplied. TestCorpus already fails when the
      # variable points somewhere unusable; what this catches is the variable
      # being set for the job but never reaching the test, which would look
      # exactly like a passing suite with the whole real corpus missing.
      - name: Verify the private corpus ran
        if: env.TOME_TEST_CORPUS_DIR != ''
        run: |
          output=$(go test -v -run TestCorpus ./internal/extract/ 2>&1)
          echo "$output" | grep 'corpus:' || true
          if echo "$output" | grep -qE 'corpus: [0-9]+ committed fixtures, 0 private pages'; then
            echo "::error::TOME_TEST_CORPUS_DIR is set for this job but no private pages loaded"
            exit 1
          fi

  fuzz:
    name: Fuzz URL canonicalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Deduplication is the property the whole archive rests on, and the
      # first minute of fuzzing found two real bugs. A short run on every
      # change is cheap insurance; the seed corpus keeps both regressions.
      - name: Fuzz
        run: go test -fuzz FuzzCanonicalize -fuzztime 60s ./internal/urlcanon/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  image:
    name: Image and acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/smoke.sh builds the image itself and then asserts the
      # acceptance criteria against a running container. Keeping the assertions
      # in the script rather than in workflow steps means they can be run
      # locally, unchanged, when CI disagrees with a developer's machine.
      - name: Acceptance criteria
        run: ./scripts/smoke.sh tomekeeper:ci
